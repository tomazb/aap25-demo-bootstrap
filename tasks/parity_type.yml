---
# Compare one object type. parity_item = {key: type_name, value: spec}
# Always records an entry in parity_results (a completed diff or an error
# entry) so a failed/missing type is never silently dropped from the report.
- name: "{{ parity_item.key }}: reset per-type facts"
  ansible.builtin.set_fact:
    parity_source_rows: null
    parity_target_rows: null
    parity_type_error: ""
    parity_type_truncated: false

- name: "{{ parity_item.key }}: fixture-mode retrieval"
  when: parity_fixture_dir is defined
  block:
    - name: "{{ parity_item.key }}: check source fixture exists"
      ansible.builtin.set_fact:
        parity_type_error: >-
          missing source fixture {{ parity_src_fixture }}
      when: not (parity_src_fixture is file)
      vars:
        parity_src_fixture: "{{ parity_fixture_dir }}/source_{{ parity_item.key }}.json"

    - name: "{{ parity_item.key }}: check target fixture exists"
      ansible.builtin.set_fact:
        parity_type_error: >-
          missing target fixture {{ parity_tgt_fixture }}
      when:
        - parity_type_error | length == 0
        - not (parity_tgt_fixture is file)
      vars:
        parity_tgt_fixture: "{{ parity_fixture_dir }}/target_{{ parity_item.key }}.json"

    - name: "{{ parity_item.key }}: load fixture rows"
      when: parity_type_error | length == 0
      block:
        - name: "{{ parity_item.key }}: read fixtures"
          ansible.builtin.set_fact:
            parity_source_rows: >-
              {{ lookup('ansible.builtin.file',
                 parity_fixture_dir ~ '/source_' ~ parity_item.key ~ '.json')
                 | from_json }}
            parity_target_rows: >-
              {{ lookup('ansible.builtin.file',
                 parity_fixture_dir ~ '/target_' ~ parity_item.key ~ '.json')
                 | from_json }}
      rescue:
        - name: "{{ parity_item.key }}: record invalid fixture JSON"
          ansible.builtin.set_fact:
            parity_type_error: "invalid fixture JSON for {{ parity_item.key }}"

- name: "{{ parity_item.key }}: live retrieval"
  when: parity_fixture_dir is not defined
  block:
    - name: "{{ parity_item.key }}: page through source"
      ansible.builtin.set_fact:
        pg_results: []
        pg_next: "{{ parity_item.value.source_path }}"
        pg_pages: 0
        pg_error: ""
        pg_truncated: false
        pg_host: "{{ source_hostname }}"
        pg_user: "{{ source_username }}"
        pg_password: "{{ source_password }}"
        pg_validate_certs: "{{ source_validate_certs }}"
    - ansible.builtin.include_tasks: paginated_get.yml
    - name: "{{ parity_item.key }}: capture source outcome"
      ansible.builtin.set_fact:
        parity_source_rows: "{{ pg_results }}"
        parity_type_error: >-
          {{ 'source retrieval failed: ' ~ pg_error if pg_error | length > 0 else '' }}
        parity_type_truncated: "{{ pg_truncated | bool }}"

    - name: "{{ parity_item.key }}: page through target"
      when: parity_type_error | length == 0
      block:
        - ansible.builtin.set_fact:
            pg_results: []
            pg_next: "{{ parity_item.value.target_path }}"
            pg_pages: 0
            pg_error: ""
            pg_truncated: false
            pg_host: "{{ target_hostname }}"
            pg_user: "{{ target_username }}"
            pg_password: "{{ target_password }}"
            pg_validate_certs: "{{ target_validate_certs }}"
        - ansible.builtin.include_tasks: paginated_get.yml
        - name: "{{ parity_item.key }}: capture target outcome"
          ansible.builtin.set_fact:
            parity_target_rows: "{{ pg_results }}"
            parity_type_error: >-
              {{ 'target retrieval failed: ' ~ pg_error
                 if pg_error | length > 0 else '' }}
            parity_type_truncated: >-
              {{ parity_type_truncated | bool or pg_truncated | bool }}
  rescue:
    - name: "{{ parity_item.key }}: record live retrieval exception"
      ansible.builtin.set_fact:
        parity_type_error: >-
          live retrieval error for {{ parity_item.key }}:
          {{ ansible_failed_result.msg | default('unknown')
             | regex_replace('https?://[^ ]+', '<url>') }}

- name: "{{ parity_item.key }}: fold truncation into the error"
  ansible.builtin.set_fact:
    parity_type_error: >-
      pagination truncated at {{ parity_max_pages | default(100) }} pages;
      results are incomplete
  when:
    - parity_type_error | length == 0
    - parity_type_truncated | bool

- name: "{{ parity_item.key }}: record operational error result"
  ansible.builtin.set_fact:
    parity_results: >-
      {{ parity_results | combine({parity_item.key:
         (parity_type_error | parity_error_result)}) }}
  when: parity_type_error | length > 0

- name: "{{ parity_item.key }}: compare and record diff"
  ansible.builtin.set_fact:
    parity_results: >-
      {{ parity_results | combine({parity_item.key:
         (parity_source_rows | parity_compare(parity_target_rows,
                                               parity_item.value))}) }}
  when:
    - parity_type_error | length == 0
    - parity_source_rows is not none
    - parity_target_rows is not none
