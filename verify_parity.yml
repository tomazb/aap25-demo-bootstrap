---
- name: Compare source (RPM) and target (OCP) AAP content
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - config/verify.yml

  vars:
    source_hostname: >-
      {{ lookup('ansible.builtin.env', 'SOURCE_AAP_HOSTNAME') | regex_replace('/+$', '') }}
    source_username: "{{ lookup('ansible.builtin.env', 'SOURCE_AAP_USERNAME') }}"
    source_password: "{{ lookup('ansible.builtin.env', 'SOURCE_AAP_PASSWORD') }}"
    source_validate_certs: >-
      {{ (lookup('ansible.builtin.env', 'SOURCE_AAP_VALIDATE_CERTS') or 'true') | bool }}
    target_hostname: >-
      {{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/+$', '') }}
    target_username: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') }}"
    target_password: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') }}"
    target_validate_certs: >-
      {{ (lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS') or 'true') | bool }}
    parity_results: {}
    parity_timestamp: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

  pre_tasks:
    - name: Reject an unknown parity_fail_on value
      ansible.builtin.assert:
        that:
          - parity_fail_on in ['missing', 'drift', 'none']
        fail_msg: >-
          parity_fail_on must be one of: missing, drift, none
          (got '{{ parity_fail_on }}').

    - name: Require HTTPS with certificate validation in live mode
      ansible.builtin.assert:
        that:
          - source_hostname is match('^https://')
          - target_hostname is match('^https://')
          - source_validate_certs | bool
          - target_validate_certs | bool
        fail_msg: >-
          Live parity requires HTTPS endpoints with certificate validation for
          both SOURCE_AAP_HOSTNAME and AAP_HOSTNAME. Install private CA trust on
          the host rather than disabling validation.
      when: parity_fixture_dir is not defined

    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - parity_fixture_dir is defined or
            (source_hostname | length > 0 and source_username | length > 0
             and source_password | length > 0)
          - parity_fixture_dir is defined or
            (target_hostname | length > 0 and target_username | length > 0
             and target_password | length > 0)
        fail_msg: >-
          Export SOURCE_AAP_HOSTNAME/SOURCE_AAP_USERNAME/SOURCE_AAP_PASSWORD
          (RPM source) and AAP_HOSTNAME/AAP_USERNAME/AAP_PASSWORD (OCP
          target), or set -e parity_fixture_dir=<dir> for offline mode.

  tasks:
    # parity_only_types (optional) restricts the run to named types; used by the
    # offline fixture tests. Unset => every enabled type.
    - name: Select object types to compare
      ansible.builtin.set_fact:
        parity_effective_types: >-
          {{ parity_types | dict2items | selectattr('value.enabled')
             | selectattr('key', 'in', parity_only_types) | list
             if parity_only_types is defined
             else parity_types | dict2items | selectattr('value.enabled') | list }}

    - name: Compare each selected object type
      ansible.builtin.include_tasks: tasks/parity_type.yml
      loop: "{{ parity_effective_types }}"
      loop_control:
        loop_var: parity_item
        label: "{{ parity_item.key }}"

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ verify_report_dir }}"
        state: directory
        mode: "0755"

    - name: Write parity reports
      ansible.builtin.copy:
        dest: "{{ verify_report_dir }}/parity-{{ parity_timestamp }}.{{ item.ext }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - ext: json
          content: "{{ parity_results | to_nice_json }}"
        - ext: md
          content: >-
            {{ parity_results | parity_report({'source': source_hostname or 'fixtures',
               'target': target_hostname or 'fixtures',
               'timestamp': parity_timestamp,
               'fail_on': parity_fail_on}) }}
      loop_control:
        label: "parity-{{ parity_timestamp }}.{{ item.ext }}"

    - name: Fail when parity is broken
      ansible.builtin.assert:
        that:
          - not (parity_results | parity_failed(parity_fail_on))
        fail_msg: >-
          Content parity failed (mode={{ parity_fail_on }}); see
          {{ verify_report_dir }}/parity-{{ parity_timestamp }}.md
          Operational errors, missing fixtures, truncation and duplicate keys
          fail in every mode.
