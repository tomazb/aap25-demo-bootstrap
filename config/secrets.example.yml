---
# Copy to config/secrets.yml, set a real password, then encrypt the copy:
#   cp config/secrets.example.yml config/secrets.yml
#   $EDITOR config/secrets.yml
#   ansible-vault encrypt config/secrets.yml
#
# config/secrets.yml is gitignored; never commit it unencrypted.
# This password is applied to every user in demo_users. The bootstrap refuses
# to run while it still has this placeholder value.
demo_user_password: 'CHANGEME-demo-password'
