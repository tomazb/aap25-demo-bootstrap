---
demo_organizations:
  - name: Demo Linux
    description: Safe Linux automation demonstrations
  - name: Demo Network
    description: Network automation demonstrations without real devices
  - name: Demo Platform
    description: Platform operations, surveys, workflows, and failure handling

demo_teams:
  - name: Demo Linux Operators
    organization: Demo Linux
    description: Operators for the Linux demo organization
  - name: Demo Network Operators
    organization: Demo Network
    description: Operators for the network demo organization
  - name: Demo Platform Operators
    organization: Demo Platform
    description: Operators for the platform demo organization

# Demo users and RBAC ---------------------------------------------------------
# Two synthetic local users per organization: one Team Admin (owner) and one
# Team Member (operator). Each team receives admin rights on its own
# organization's inventories, projects, and job templates, so every user only
# sees and manages their own organization's demo content.
#
# Passwords are never stored in this file. Provide demo_user_password from an
# Ansible Vault-encrypted file (see README section 4); it is applied to every
# demo user. Set demo_create_users to false to skip local user creation
# entirely (for example when teams map to an external IdP).
demo_create_users: true

demo_users:
  - username: demo-alice
    first_name: Alice
    last_name: Linux
    email: demo-alice@demo.example
    organization: Demo Linux
    team: Demo Linux Operators
    team_role: Team Admin
  - username: demo-bob
    first_name: Bob
    last_name: Linux
    email: demo-bob@demo.example
    organization: Demo Linux
    team: Demo Linux Operators
    team_role: Team Member
  - username: demo-carol
    first_name: Carol
    last_name: Network
    email: demo-carol@demo.example
    organization: Demo Network
    team: Demo Network Operators
    team_role: Team Admin
  - username: demo-dave
    first_name: Dave
    last_name: Network
    email: demo-dave@demo.example
    organization: Demo Network
    team: Demo Network Operators
    team_role: Team Member
  - username: demo-erin
    first_name: Erin
    last_name: Platform
    email: demo-erin@demo.example
    organization: Demo Platform
    team: Demo Platform Operators
    team_role: Team Admin
  - username: demo-frank
    first_name: Frank
    last_name: Platform
    email: demo-frank@demo.example
    organization: Demo Platform
    team: Demo Platform Operators
    team_role: Team Member

demo_inventories:
  - name: Demo Linux Inventory
    organization: Demo Linux
    description: Synthetic Linux inventory; every host uses a local connection
    variables:
      demo_environment: lab
      demo_owner: linux-team
  - name: Demo Network Inventory
    organization: Demo Network
    description: Synthetic network inventory; no real network devices are contacted
    variables:
      demo_environment: lab
      demo_owner: network-team
  - name: Demo Platform Inventory
    organization: Demo Platform
    description: Synthetic platform inventory for surveys and controlled outcomes
    variables:
      demo_environment: lab
      demo_owner: platform-team

demo_hosts:
  - name: web01.demo
    inventory: Demo Linux Inventory
    description: Synthetic web node 1
    variables:
      ansible_connection: local
      demo_role: web
      demo_site: dc1
  - name: web02.demo
    inventory: Demo Linux Inventory
    description: Synthetic web node 2
    variables:
      ansible_connection: local
      demo_role: web
      demo_site: dc2
  - name: db01.demo
    inventory: Demo Linux Inventory
    description: Synthetic database node
    variables:
      ansible_connection: local
      demo_role: database
      demo_site: dc1
  - name: edge01.demo
    inventory: Demo Network Inventory
    description: Synthetic edge router
    variables:
      ansible_connection: local
      demo_role: edge-router
      demo_site: dc1
  - name: core01.demo
    inventory: Demo Network Inventory
    description: Synthetic core switch
    variables:
      ansible_connection: local
      demo_role: core-switch
      demo_site: dc1
  - name: platform01.demo
    inventory: Demo Platform Inventory
    description: Synthetic platform endpoint
    variables:
      ansible_connection: local
      demo_role: platform
      demo_site: dc1

demo_groups:
  - name: web
    inventory: Demo Linux Inventory
    description: Web tier
    hosts:
      - web01.demo
      - web02.demo
    variables:
      service_tier: frontend
  - name: database
    inventory: Demo Linux Inventory
    description: Database tier
    hosts:
      - db01.demo
    variables:
      service_tier: data
  - name: routers
    inventory: Demo Network Inventory
    description: Router role
    hosts:
      - edge01.demo
    variables:
      network_os_family: demo-router
  - name: switches
    inventory: Demo Network Inventory
    description: Switch role
    hosts:
      - core01.demo
    variables:
      network_os_family: demo-switch
  - name: platform
    inventory: Demo Platform Inventory
    description: Platform endpoints
    hosts:
      - platform01.demo
    variables:
      service_tier: platform

demo_projects:
  - name: Demo Linux Content
    organization: Demo Linux
  - name: Demo Network Content
    organization: Demo Network
  - name: Demo Platform Content
    organization: Demo Platform

demo_job_templates:
  - name: Demo 01 - Linux hello
    organization: Demo Linux
    inventory: Demo Linux Inventory
    project: Demo Linux Content
    playbook: content/playbooks/hello.yml
    description: Read-only hello-world run across synthetic Linux hosts
    survey: false
  - name: Demo 02 - Linux inventory report
    organization: Demo Linux
    inventory: Demo Linux Inventory
    project: Demo Linux Content
    playbook: content/playbooks/inventory_report.yml
    description: Builds a host and group report using only controller inventory data
    survey: false
  - name: Demo 03 - Network discovery simulation
    organization: Demo Network
    inventory: Demo Network Inventory
    project: Demo Network Content
    playbook: content/playbooks/inventory_report.yml
    description: Simulates network discovery without contacting network equipment
    survey: false
  - name: Demo 04 - Surveyed platform change
    organization: Demo Platform
    inventory: Demo Platform Inventory
    project: Demo Platform Content
    playbook: content/playbooks/surveyed_change.yml
    description: Demonstrates a required survey and change-ticket metadata
    survey: true
  - name: Demo 05 - Controlled outcome
    organization: Demo Platform
    inventory: Demo Platform Inventory
    project: Demo Platform Content
    playbook: content/playbooks/controlled_outcome.yml
    description: Produces either a successful or intentionally failed job
    survey: false

# Additional object types so every enabled parity type in config/verify.yml is
# exercised by seeded content. Execution environments are deliberately NOT
# seeded: a custom EE needs a pullable image, and a broken image reference is
# worse demo content than none. Default EEs exist on both sides of a
# migration and exercise that parity type.
demo_credentials:
  - name: Demo Platform Machine Credential
    organization: Demo Platform
    credential_type: Machine
    description: Synthetic machine credential; the password is a fake literal
    inputs:
      username: demo-service
      password: demo-not-a-real-secret

demo_labels:
  - name: demo-controlled
    organization: Demo Platform

demo_notification_templates:
  - name: Demo Webhook Notifier
    organization: Demo Linux
    notification_type: webhook
    description: Safe webhook notifier; target URL is non-routable by design
    notification_configuration:
      url: https://demo-notifications.invalid/hook
      http_method: POST
      headers: {}
      disable_ssl_verification: false
      username: ""
      password: ""

demo_workflow_job_templates:
  - name: Demo WF - Linux hello then report
    organization: Demo Platform
    description: Chains the hello demo into the inventory report demo
    nodes:
      - identifier: hello
        unified_job_template: Demo 01 - Linux hello
        success_nodes: [report]
      - identifier: report
        unified_job_template: Demo 02 - Linux inventory report
        success_nodes: []

demo_schedules:
  - name: Demo Weekly Hello
    unified_job_template: Demo 01 - Linux hello
    description: Weekly recurring safe hello run
    rrule: "DTSTART;TZID=UTC:20260803T060000 RRULE:FREQ=WEEKLY;INTERVAL=1;BYDAY=MO"
    enabled: true

demo_seed_jobs:
  - template: Demo 01 - Linux hello
    organization: Demo Linux
    extra_vars:
      demo_message: First seeded Linux demo run
  - template: Demo 02 - Linux inventory report
    organization: Demo Linux
    extra_vars:
      report_id: DEMO-LINUX-001
  - template: Demo 03 - Network discovery simulation
    organization: Demo Network
    extra_vars:
      report_id: DEMO-NET-001
  - template: Demo 04 - Surveyed platform change
    organization: Demo Platform
    extra_vars:
      change_ticket: DEMO-0001
      change_summary: Seeded platform change demonstration
      requested_environment: development
  - template: Demo 05 - Controlled outcome
    organization: Demo Platform
    extra_vars:
      demo_fail: false
      outcome_note: Seeded successful controlled run
  - template: Demo 05 - Controlled outcome
    organization: Demo Platform
    expect_failure: true
    extra_vars:
      demo_fail: true
      outcome_note: Seeded intentional failure for dashboard history
