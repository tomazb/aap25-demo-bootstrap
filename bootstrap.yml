---
- name: Populate AAP 2.5 with safe demo configuration and history
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - config/demo.yml

  vars:
    aap_bootstrap_hostname: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') }}"
    aap_bootstrap_username: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') }}"
    aap_bootstrap_password: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') }}"
    aap_bootstrap_validate_certs: >-
      {{ (lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS') or 'true') | bool }}
    # Lab-only escape hatch, mirroring the verify_* playbooks. Default false;
    # when true the HTTPS/cert requirement below is relaxed. Never use this
    # against a real target.
    bootstrap_allow_insecure: false

  # Controller modules only read CONTROLLER_* environment variables on most
  # ansible.controller 4.6.x builds (AAP_* support arrived late in the 4.6.z
  # stream). Feed them the AAP_* values explicitly so a single set of AAP_*
  # exports drives both collections. The gateway URL works as controller_host
  # because ansible.controller defaults its API base to /api/controller/.
  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_bootstrap_hostname }}"
      controller_username: "{{ aap_bootstrap_username }}"
      controller_password: "{{ aap_bootstrap_password }}"
      validate_certs: "{{ aap_bootstrap_validate_certs }}"

  pre_tasks:
    - name: Validate required bootstrap inputs
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'AAP_HOSTNAME') | length > 0
          - lookup('ansible.builtin.env', 'AAP_USERNAME') | length > 0
          - lookup('ansible.builtin.env', 'AAP_PASSWORD') | length > 0
          - demo_scm_url is defined
          - demo_scm_url | length > 0
        fail_msg: >-
          Export AAP_HOSTNAME, AAP_USERNAME, AAP_PASSWORD and pass
          -e demo_scm_url=https://your.git.example/aap/aap25-demo-bootstrap.git

    - name: Require secure transport before sending admin credentials
      ansible.builtin.assert:
        that:
          - aap_bootstrap_hostname is match('^https://')
          - aap_bootstrap_validate_certs | bool
        fail_msg: >-
          Export an HTTPS AAP_HOSTNAME and keep certificate validation enabled
          (install private CA trust rather than disabling it). Admin
          credentials must not be sent over HTTP or without certificate
          validation. Set -e bootstrap_allow_insecure=true only for a
          throwaway lab.
      when: not (bootstrap_allow_insecure | bool)

  tasks:
    - name: Create demo organizations through platform gateway
      ansible.platform.organization:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        state: present
      loop: "{{ demo_organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create demo teams through platform gateway
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        description: "{{ item.description }}"
        state: present
      loop: "{{ demo_teams }}"
      loop_control:
        label: "{{ item.organization }} / {{ item.name }}"

    - name: Build organization to team name mapping for RBAC assignments
      ansible.builtin.set_fact:
        demo_team_by_org: "{{ demo_teams | items2dict(key_name='organization', value_name='name') }}"

    - name: Create demo users and their role assignments
      when: demo_create_users | default(true) | bool
      tags:
        - users
      block:
        - name: Validate demo user password input
          ansible.builtin.assert:
            that:
              - demo_user_password is defined
              - demo_user_password | length > 0
              - demo_user_password != 'CHANGEME-demo-password'
            fail_msg: >-
              demo_user_password is required when demo_create_users is true and must not
              keep the placeholder value from config/secrets.example.yml. Provide it
              from an Ansible Vault-encrypted file: ansible-playbook bootstrap.yml
              -e demo_scm_url=<url> -e @config/secrets.yml --ask-vault-pass
              Or skip user creation with: -e demo_create_users=false

        - name: Create demo users through platform gateway
          ansible.platform.user:
            username: "{{ item.username }}"
            first_name: "{{ item.first_name }}"
            last_name: "{{ item.last_name }}"
            email: "{{ item.email }}"
            password: "{{ demo_user_password }}"
            update_secrets: false
            state: present
          loop: "{{ demo_users }}"
          loop_control:
            label: "{{ item.username }}"

        - name: Add demo users as members of their organization
          ansible.platform.role_user_assignment:
            role_definition: Organization Member
            user: "{{ item.username }}"
            object_ids:
              - "{{ item.organization }}"
            state: present
          loop: "{{ demo_users }}"
          loop_control:
            label: "{{ item.username }} -> {{ item.organization }}"

        - name: Assign demo users their team roles
          ansible.platform.role_user_assignment:
            role_definition: "{{ item.team_role }}"
            user: "{{ item.username }}"
            object_ids:
              - "{{ item.team }}"
            state: present
          loop: "{{ demo_users }}"
          loop_control:
            label: "{{ item.username }} -> {{ item.team }} ({{ item.team_role }})"

    # The controller learns about gateway-created organizations through a
    # periodic resource sync (15-minute default interval); there is no push.
    # On a fresh instance the organizations above may not exist on the
    # controller side yet, so wait for them before creating controller
    # objects that reference them. 60 retries x 15 s covers one full sync
    # interval.
    - name: Wait for gateway organizations to propagate to the controller
      ansible.builtin.uri:
        url: >-
          {{ aap_bootstrap_hostname | regex_replace('/+$', '')
          }}/api/controller/v2/organizations/?name={{ item.name | urlencode }}
        method: GET
        user: "{{ aap_bootstrap_username }}"
        password: "{{ aap_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_bootstrap_validate_certs }}"
        return_content: true
      register: demo_org_sync
      until:
        - demo_org_sync.json is defined
        - demo_org_sync.json.count | int >= 1
      retries: 60
      delay: 15
      loop: "{{ demo_organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create controller inventories
      ansible.controller.inventory:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        description: "{{ item.description }}"
        variables: "{{ item.variables }}"
        state: present
      loop: "{{ demo_inventories }}"
      loop_control:
        label: "{{ item.organization }} / {{ item.name }}"
      register: demo_inventory_creation

    - name: Create synthetic hosts
      ansible.controller.host:
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        description: "{{ item.description }}"
        variables: "{{ item.variables }}"
        enabled: true
        state: present
      loop: "{{ demo_hosts }}"
      loop_control:
        label: "{{ item.inventory }} / {{ item.name }}"

    - name: Create inventory groups and host associations
      ansible.controller.group:
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        description: "{{ item.description }}"
        hosts: "{{ item.hosts }}"
        variables: "{{ item.variables }}"
        preserve_existing_hosts: false
        state: present
      loop: "{{ demo_groups }}"
      loop_control:
        label: "{{ item.inventory }} / {{ item.name }}"

    - name: Create SCM projects and wait for successful synchronization
      ansible.controller.project:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        description: Demo content managed as code
        scm_type: git
        scm_url: "{{ demo_scm_url }}"
        scm_branch: "{{ demo_scm_branch | default('main') }}"
        scm_clean: true
        scm_delete_on_update: true
        scm_update_on_launch: true
        wait: true
        update_project: true
        state: present
      loop: "{{ demo_projects }}"
      loop_control:
        label: "{{ item.organization }} / {{ item.name }}"
      register: demo_project_creation

    - name: Create demo job templates
      ansible.controller.job_template:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        description: "{{ item.description }}"
        job_type: run
        inventory: "{{ item.inventory }}"
        project: "{{ item.project }}"
        playbook: "{{ item.playbook }}"
        ask_variables_on_launch: true
        survey_enabled: "{{ item.survey }}"
        survey_spec: "{{ demo_change_survey if item.survey else omit }}"
        verbosity: 0
        state: present
      loop: "{{ demo_job_templates }}"
      loop_control:
        label: "{{ item.organization }} / {{ item.name }}"
      register: demo_job_template_creation
      vars:
        demo_change_survey:
          name: Demo change request
          description: Required metadata for the surveyed platform-change demo
          spec:
            - question_name: Change ticket
              question_description: Synthetic change identifier
              required: true
              type: text
              variable: change_ticket
              min: 1
              max: 64
              default: DEMO-0001
            - question_name: Change summary
              question_description: Short human-readable description
              required: true
              type: text
              variable: change_summary
              min: 1
              max: 200
              default: Demonstrate AAP survey handling
            - question_name: Requested environment
              question_description: Select a synthetic target environment
              required: true
              type: multiplechoice
              variable: requested_environment
              choices:
                - development
                - test
                - production
              default: development

    - name: Grant teams admin rights on their organization inventories
      ansible.controller.role_team_assignment:
        role_definition: Inventory Admin
        team: "{{ demo_team_by_org[item.item.organization] }}"
        object_id: "{{ item.id }}"
        state: present
      loop: "{{ demo_inventory_creation.results }}"
      loop_control:
        label: "{{ item.item.organization }} / {{ item.item.name }}"
      tags:
        - rbac

    - name: Grant teams admin rights on their organization projects
      ansible.controller.role_team_assignment:
        role_definition: Project Admin
        team: "{{ demo_team_by_org[item.item.organization] }}"
        object_id: "{{ item.id }}"
        state: present
      loop: "{{ demo_project_creation.results }}"
      loop_control:
        label: "{{ item.item.organization }} / {{ item.item.name }}"
      tags:
        - rbac

    - name: Grant teams admin rights on their organization job templates
      ansible.controller.role_team_assignment:
        role_definition: JobTemplate Admin
        team: "{{ demo_team_by_org[item.item.organization] }}"
        object_id: "{{ item.id }}"
        state: present
      loop: "{{ demo_job_template_creation.results }}"
      loop_control:
        label: "{{ item.item.organization }} / {{ item.item.name }}"
      tags:
        - rbac

    - name: Seed controller job history
      ansible.controller.job_launch:
        name: "{{ item.template }}"
        organization: "{{ item.organization }}"
        extra_vars: "{{ item.extra_vars }}"
        wait: true
        interval: 2
        timeout: 300
      loop: "{{ demo_seed_jobs }}"
      loop_control:
        label: "{{ item.organization }} / {{ item.template }}"
      ignore_errors: "{{ item.expect_failure | default(false) }}"
      tags:
        - seed_history
